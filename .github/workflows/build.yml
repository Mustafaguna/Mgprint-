name: Build Android APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract ZIP to Root
        run: |
          mkdir -p temp_extracted
          unzip -o *.zip -d temp_extracted
          # ZIP içindeki 'app', 'gradle', 'build.gradle.kts' dosyalarını bulup ana dizine taşır
          ROOT_DIR=$(find temp_extracted -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          cp -rn $ROOT_DIR/* .
          chmod +x gradlew
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGPrint-APK
          path: "**/build/outputs/apk/debug/*.apk"
